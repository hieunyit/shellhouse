# Electron + electron-builder ổn định nhất với node_modules phẳng.
nodeLinker: hoisted

# Script cài đặt của dependency bị chặn mặc định. Chỉ cho phép thứ thật sự cần.
# - node-pty: KHÔNG build lúc install; build riêng cho ABI của Electron bằng `pnpm rebuild:native`.
# - better-sqlite3, sodium-native: dùng bản build N-API có sẵn (prebuilds/), không cần build.
# ssh2/cpu-features: binding tăng tốc tuỳ chọn, bỏ để giảm phụ thuộc native.
# - @serialport/bindings-cpp: dùng bản build N-API có sẵn (prebuilds/, mọi OS), không cần build.
allowBuilds:
  electron: true
  esbuild: true
  better-sqlite3: false
  cpu-features: false
  node-pty: false
  ssh2: false
  electron-winstaller: false
  unrs-resolver: false
  '@serialport/bindings-cpp': false

# Cảnh báo audit được chấp nhận có lý do (xem lại khi cập nhật dependency):
# - GHSA-wm7h-9275-46v2 (dicer ≤0.3.1): chỉ qua s3rver — server S3 giả lập CHỈ dùng trong test
#   (devDependency, không có trong app phát hành). Lỗi nằm ở phần nhận form upload multipart
#   (HTML POST), test không dùng tới.
auditConfig:
  ignoreGhsas:
    - GHSA-wm7h-9275-46v2
