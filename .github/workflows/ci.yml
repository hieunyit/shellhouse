name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        if: runner.os == 'Linux'
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        shell: bash
        run: set -o pipefail; pnpm test 2>&1 | tee unit.log

      - name: Rebuild native modules for Electron
        run: pnpm rebuild:native

      - name: Build
        run: pnpm build

      - name: Allow Electron's sandbox (Ubuntu 24.04 AppArmor)
        if: runner.os == 'Linux'
        # Ubuntu 24.04 chặn user namespace không đặc quyền → sandbox Chromium không khởi động được.
        # Chỉ nới trên máy CI tạm thời; bản phát hành không đổi gì.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: E2E (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: set -o pipefail; xvfb-run --auto-servernum pnpm test:e2e 2>&1 | tee e2e.log

      - name: E2E
        if: runner.os != 'Linux'
        shell: bash
        run: set -o pipefail; pnpm test:e2e 2>&1 | tee e2e.log

      - name: Show failures as annotations
        if: failure()
        shell: bash
        run: |
          node scripts/ci-annotate.mjs unit.log "Unit tests (${{ matrix.os }})"
          node scripts/ci-annotate.mjs e2e.log "E2E (${{ matrix.os }})"

      - name: Package (unsigned)
        run: pnpm exec electron-builder --dir --publish never

      - name: Smoke test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:package

      - name: Smoke test packaged app
        if: runner.os != 'Linux'
        run: pnpm test:package

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          retention-days: 7
