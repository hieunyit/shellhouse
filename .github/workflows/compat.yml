name: SSH compatibility

# Ma trận server SSH thật trong Docker (KE-HOACH-MOI.md 8.2): OpenSSH 7.4 / 8.2 / 9.6 / mới nhất,
# Dropbear, thiết bị đời cũ, 2FA TOTP, bastion 2 tầng. Xem test/compat/.
on:
  schedule:
    - cron: '47 20 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/session-host/**'
      - 'src/main/hosts/**'
      - 'test/compat/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compatibility matrix
        run: pnpm test:compat
      - name: Server logs
        if: failure()
        run: docker compose -f test/compat/docker-compose.yml logs --no-color || true
